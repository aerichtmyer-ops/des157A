<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@700&family=Paytone+One&family=Readex+Pro:wght@300&display=swap" rel="stylesheet">

    <link href="styles.css" rel="stylesheet">

    <script src="script.js" defer></script> 

    <script></script>

    <title>Mad Libs V1</title>
</head>
<body>

    <div id = "container">

        <main>

           
       
            <div class = "box">
                

                <header>

                     <h1> Otter Treasure Hunt</h1>
            
                 </header>
                    
                    <h2>Fill in the blanks to help the otter find the legendary pearl!</h2>
                        
                <article>
                            
                    <form>
                                                         
                        <div class = "lib">
                               
                            <div class="field">
                                 <label for="name">Name</label>
                                 <input type ="text" id="name">
                            </div>
                               
                            <div class="field">
                                <label for="acessorySelect">Accessory</label>
                                <select id="acessorySelect" name ="acessory">
                                    <option value = "">- - -</option>
                                    <option value ="Mustache">Mustache</option>
                                    <option value = "Glasses">Glasses</option>
                                    <option value = "Hat">Hat</option>
                                    <option value = "hairpin">Hairpin</option>
                                </select>
                            </div>
                                
                            <div class="field">
                                <label for ="adjective">Adjective</label>
                                <input type ="text" id="adjective">
                            </div>
                    
                            <div class="field">
                                <label for="verb">Verb</label>
                                <input type ="text" id="verb" placeholder="ending in -ing">
                            </div>
                               
                            <div class="field">
                                <label for="tool">Tool</label>
                                <input type ="text" id ="tool">
                            </div>

                            <div class="field">
                                <label for="color">Color</label>
                                <select id="color" name="color">
                                    <option value = "">- - -</option>
                                    <option value ="red">Red</option>
                                    <option value = "pink">Pink</option>
                                    <option value = "blue">Blue</option>
                                    <option value = "green">Green</option>
                                </select>
                            </div>
                                
                        </div>
                                <input type = "submit" value="Submit for Treasure!">
                        </form>
                    </article>   
                
                    
                </div>
    
        </main>
        <img src="images/rock.png" height="750" width ="350" alt="rocks on right side of screen">
        
        <footer>
            <p>Alexis Richtmyer</p>

            <address> <a href="mailto:&#097;&#101;&#114;&#105;&#099;&#104;&#116;&#109;&#121;&#101;&#114;&#064;&#117;&#099;&#100;&#097;&#118;&#105;&#115;&#046;&#101;&#100;&#117;">Email</a></address>
        </footer>
    </div>
</body>
</html>
