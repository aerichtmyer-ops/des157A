<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">

   <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&family=Paytone+One&family=Readex+Pro:wght@700&display=swap" rel="stylesheet">

    <link href="styles.css" rel="stylesheet">

    <script src="script.js" defer></script> 

    <script></script>

    <title>Mad Libs V1</title>
</head>
<body>
   
    <div id = "container">

          <header>

                     <h1> Otter Treasure Hunt</h1>
            
                 </header>


    <div class = "page-bg">
        <main>
           
            
            <img class="otterImg" src="images/otter.svg" height="200" width="150" alt="Otter illustration">

            <div class = "box">
                    
                    <h2>Fill in the blanks to help the otter find the legendary pearl!</h2>
                        
                <article>
                            
                    <form>
                                                         
                        <div class = "lib">
                               
                            <div class="field">
                                 <label for="name">Name</label>
                                 <input type ="text" id="name" required>
                            </div>
                               
                            <div class="field">
                                <label for="accessorySelect">Accessory</label>
                                <select id="accessorySelect" name ="accessory" required>
                                    <option value = "">- - -</option>
                                    <option value ="Mustache">Mustache</option>
                                    <option value = "Glasses">Glasses</option>
                                    <option value = "Hat">Hat</option>
                                    <option value = "hairpin">Hairpin</option>
                                </select>
                            </div>
                                
                            <div class="field">
                                <label for ="adjective">Adjective</label>
                                <input type ="text" id="adjective" required>
                            </div>
                    
                            <div class="field">
                                <label for="verb">Verb</label>
                                <input type ="text" id="verb" placeholder="ending in -ing" required>
                            </div>
                               
                            <div class="field">
                                <label for="tool">Tool</label>
                                <input type ="text" id ="tool" required>
                            </div>

                            <div class="field">
                                <label for="color">Color</label>
                                <select id="color" name="color" required>
                                    <option value = "">- - -</option>
                                    <option value ="red">Red</option>
                                    <option value = "pink">Pink</option>
                                    <option value = "blue">Blue</option>
                                    <option value = "green">Green</option>
                                </select>
                            </div>
                                
                        </div>
                                <input type = "submit" value="Submit for Treasure!">
                        </form>
                    </article>   
                    
                </div>

            <div id = "answer" class="hidden">
                <p class = "result"></p> 
             </div>
    
        </main>
        
        <img class ="purpleStar" src = "images/purplestar.svg" height = "45" width = "55" alt="purple spinning starfish">
        <img class= "redStar" src = "images/redstar.png" height="35" width="45" alt="red spinning starfish">
        <img class = "blueStar" src = "images/bluestar.svg" height = "45" width = "55" alt="blue spinning starfish">
        <img  class = "rock" src="images/rock.png" height="750" width ="350" alt="rocks on right side of screen">
        
        <footer>
            <p>Alexis Richtmyer</p>

            <a href="../index.html">Portal</a>

        </footer>
        </div>
    </div>
</body>
</html>
